  risk-domain-assessment-udm:
    output_contract:
      format: json_object
      scope: shared_udm_semantics_repo_local_schema
      notes: >
        Repo-local 14-domain institutional risk-rubric contract. Three
        structured blocks (award_metadata, domain_scores,
        aggregate_metrics) where domain_scores is 14 typed blocks each
        with a JSON integer score (1-5), an evidence-cited
        justification, and domain-specific evidence fields. The
        consolidator computes aggregate_metrics deterministically
        (total_risk_score sum, average_risk_score quotient, four-value
        overall_risk_level enum) and derives high_risk_domains,
        key_risk_findings, recommended_mitigations from the per-domain
        scores. All scores are JSON integers per the boss's PR #33
        review feedback.
    triad_integration:
      evaluation_datasets: []
      harness_notes: >
        Validate JSON outputs against schema.json. Canonical single-call
        invocation surface is prompt.md. The companion top-level
        workflows/risk-domain-assessment Vandalizer workflow at v0.1.0
        implements the contract as six parallel Extraction tasks (each
        covering 2-4 of the 14 domains) plus a Consolidation Prompt
        that assembles the 14 domain blocks, computes aggregate_metrics
        deterministically, and derives high_risk_domains /
        key_risk_findings / recommended_mitigations. Campaign authors
        should record both single-call and post-consolidation signals
        when both are available.
      udm_alignment:
        status: shared_udm_semantics_repo_local_schema
        notes: >
          award_metadata fields and selected evidence fields resolve to
          UDM entities: award_number to Award.Award_Number;
          award_period_start / award_period_end to
          Award.Original_Start_Date / Original_End_Date; sponsor_name to
          Organization.Organization_Name; cfda_number to
          Award.CFDA_Number; domain_1.project_title to Award.Award_Title;
          domain_2.total_federal_funding to Award.Current_Total_Funded;
          domain_2.cost_share_required and cost_share_amount to
          CostShare.Is_Mandatory and CostShare.Committed_Amount;
          domain_2.idc_rate_restriction to IndirectRate.Rate_Percentage;
          domain_3.subrecipient_risk_level and
          subrecipient_monitoring_requirements to Subaward.Risk_Level
          and Subaward.Monitoring_Plan; domain_5.compliance_requirement_type
          and compliance_risk_level to ComplianceRequirement
          (Requirement_Type, Risk_Level); domain_6.reporting_frequency
          and reporting_requirements_detail to Terms.Invoicing_Frequency
          and Terms.Reporting_Requirements; domain_8.pass_through_indicator
          to Award.Flow_Through_Indicator; domain_10.closeout_requirements
          and property_equipment_obligations to Terms.Closeout_Requirements
          and Terms.Property_Requirements; domain_12.publication_requirements
          to Terms.Publication_Requirements; domain_13.special_conditions
          to Terms.Special_Conditions. The 14-domain rubric and
          aggregate-metrics shape themselves are repo-local — no shared
          UDM risk-rubric table exists yet.
    related_components:
      - slug: award-compliance-extraction-udm
        relationship: complementary_focus
        notes: >
          risk-domain-assessment-udm produces a one-time institutional
          risk profile (run at award acceptance and on major
          modifications); award-compliance-extraction-udm runs
          continuously through the award lifecycle to monitor the
          compliance framework. The risk-assessment Domain 5
          (Compliance & Regulatory) evidence fields overlap with the
          award-compliance contract's compliance_framework block.
      - slug: export-to-banner-extraction-udm
        relationship: sibling_award_consumption
        notes: >
          Both components consume the same fully-executed award
          document(s). risk-domain-assessment-udm produces an
          institutional risk profile;
          export-to-banner-extraction-udm produces operational Banner
          ERP setup fields.

