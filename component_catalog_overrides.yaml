        invocation surface is prompt.md. The companion top-level
        workflows/budget-justification-generator Vandalizer workflow at
        v0.1.0 implements the contract as four parallel Extraction tasks
        (each both extracting data AND generating section narratives)
        plus a Consolidation Prompt that computes four arithmetic checks
        deterministically and renders final_justification_document as a
        single Markdown string in R&R Budget / SF-424A category order.
        Scoring is two-layered — structured fields validate against
        schema.json and arithmetic_checks; narrative strings require
        human review against the project narrative and budget form.
      udm_alignment:
        status: shared_udm_semantics_repo_local_schema
