# NSFAwardExtract (Vandalizer search set) -> nsf-award-notice-extraction-udm schema
# Field-title mapping with normalization rules. Consumed by the AI4RA Evaluation
# Explorer (backend/app/ingest/vandalizer.py) for ground-truth emission; titles
# are matched case/punctuation-insensitively.
version: 0.1.0
target_component: nsf-award-notice-extraction-udm
target_version: 1.1.0
scalars:
  - title: "Award Number (FAIN)"
    path: award_number
    normalize: str
  - title: "Managing Division Abbreviation"
    path: managing_division
    normalize: str
  - title: "Amendment Number"
    path: amendment_number
    normalize: str
  - title: "Amendment Type"
    path: amendment_type
    normalize: str
  - title: "Amendment Date"
    path: amendment_date
    normalize: date
  - title: "Amendment Description"
    path: amendment_description
    normalize: str
  - title: "Proposal Number"
    path: proposal_number
    normalize: str
  - title: "Award Instrument"
    path: award_instrument
    normalize: str
  - title: "Award Date"
    path: award_date
    normalize: date
  - title: "Award Period of Performance Start Date"
    path: start_date
    normalize: date
  - title: "Award Period of Performance End Date"
    path: end_date
    normalize: date
  - title: "Project Title"
    path: award_title
    normalize: str
  - title: "Research and Development Award"
    path: is_research_and_development
    normalize: bool
  - title: "Amount Obligated by This Amendment"
    path: amount_obligated_this_amendment
    normalize: money
  - title: "Total Intended Award Amount"
    path: total_intended_amount
    normalize: money
  - title: "Total Approved Cost Share or Matching Amount"
    path: cost_share_approved_amount
    normalize: money
  - title: "Total Amount Obligated to Date"
    path: total_obligated_to_date
    normalize: money
  - title: "Expenditure Limitation"
    path: expenditure_limitation
    normalize: str
  - title: "Indirect Cost Rate Value"
    path: indirect_cost_rate_percent
    normalize: percent
  - title: "Indirect Cost Rate Name"
    path: indirect_cost_base
    normalize: str
  - title: "Fees Amount"
    path: fees
    normalize: money
  - title: "Recipient Legal Business Name"
    path: recipient_organization.legal_name
    normalize: str
  - title: "Recipient Address"
    path: recipient_organization.address
    normalize: str
  - title: "Official Recipient Email Address"
    path: recipient_organization.email
    normalize: str
  - title: "Unique Entity Identifier"
    path: recipient_organization.uei
    normalize: str
compound_splits:
  - title: "Funding Opportunity"
    paths: [funding_opportunity_number, funding_opportunity_title]
  - title: "Assistance Listing Number(s) and Name(s)"
    paths: [cfda_number, cfda_name]
structured:
  project_personnel: [PI, Co-PI from semicolon-delimited Name/Email/Organization triples]
  sponsor_contacts: ["Managing Grants Official", "Awarding Official", "Managing Program Officer"]
