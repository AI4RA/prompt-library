# Authored source for the Award Compliance & Financial Overview Extraction
# Vandalizer workflow.
#
# === Topology (v0.2.2, Variant A + KB injection) ===
#
# v0.2.2 changes vs. v0.2.1:
#   - Recalibrated two validation_plan checks (ac-header-financial-fields,
#     ac-placeholder-discipline) after a real Validate run: they demanded the
#     literal "Not specified in the document" / "Not required", but the
#     consolidation deliverable legitimately renders "Not specified" (table
#     cells) and "Not required (—)". The checks now accept any equivalent
#     placeholder variant and only fail on blank/dropped fields. No change to
#     runnable steps or output.
#
# v0.2.1 changes vs. v0.2.0:
#   - validation_plan rewritten as a hand-authored, contract-aware
#     CORE-CONTRACT plan in the Vandalizer RUNTIME schema
#     ({id, name, description, category}) so it imports cleanly and runs
#     in Vandalizer's editor "Validate" feature. The prior
#     {check_id, check_type, severity, target_fields} schema was inert:
#     Vandalizer's evaluator reads c["id"]/c["name"]/c["description"]/
#     c["category"], so the old keys never matched (and would KeyError on
#     Validate). No change to runnable steps or output.
#   - category vocabulary is Vandalizer's: completeness | accuracy |
#     content | formatting (scored x1.5 / x1.3 / x1.0 / x0.7).
#
# v0.2.0 changes vs. v0.1.1:
#   1. Parallel Extraction tasks converted to Prompt tasks.
#   2. Output contract: RA-friendly Markdown Award Compliance & Financial
#      Overview (five SECTIONs per source consolidation.md).
#   3. Step 0 KnowledgeBaseQuery added.

name: Award Compliance & Financial Overview Extraction
description: >
  Uploads a fully-executed federal award notice or agreement and
  returns an RA-friendly Markdown Award Compliance & Financial Overview
  covering award header information, financial summary, approved budget
  & restrictions, governing regulations (prioritized), and key
  administrative requirements (reporting, prior approval, compliance
  deadlines). Mirrors the source ui-insight/ProcessMapping
  award-compliance-extraction consolidation.md conventions.

workflow_version: 0.2.2
vandalizer_schema_version: 2
status: experimental
owner: ui-insight
created: 2026-04-30
updated: 2026-06-06

components:
  - slug: award-compliance-extraction-udm
    pinned_version: 0.1.0

# Hand-authored CORE-CONTRACT validation plan in Vandalizer's RUNTIME
# schema. Each check: id (stable, unique), name (<=60 chars), description
# (what the LLM evaluator looks for in the ACTUAL output), category (one of
# completeness | accuracy | content | formatting). Vandalizer evaluates these
# against the last <=3 completed runs' final output, cross-referenced with the
# source document and intermediate step outputs. Clicking "Regenerate" in the
# editor OVERWRITES this with an LLM-generated plan — re-import to restore.
validation_plan:
  - id: ac-sections-complete
    category: completeness
    name: Required sections present and ordered
    description: >
      The deliverable opens with an H1 title line "Award Compliance &
      Financial Overview: <FAIN>" and contains all five H3 sections IN THIS
      EXACT ORDER: AWARD HEADER INFORMATION, FINANCIAL SUMMARY, APPROVED
      BUDGET & RESTRICTIONS, GOVERNING REGULATIONS, KEY ADMINISTRATIVE
      REQUIREMENTS. FAIL if any of these five sections is missing, renamed,
      or out of order.
  - id: ac-header-financial-fields
    category: completeness
    name: Header and financial summary fields populated
    description: >
      AWARD HEADER INFORMATION lists Project Title, Awardee Organization,
      Federal Award Identification Number (FAIN), and Period of Performance.
      The FINANCIAL SUMMARY table contains all seven rows: Total Award
      Amount, Total Anticipated Amount, Total Direct Costs, Total Indirect
      Costs, F&A Rate (with its base), Cost Share, and Program Income. Every
      field is either populated from the document or carries a clear
      absent-value placeholder — accept ANY of "Not specified", "Not
      specified in the document", "Not required", "Not required (—)", or "—".
      Do NOT fail on which placeholder variant is used; FAIL only if a field
      is blank/empty or a required row is dropped.
  - id: ac-monetary-fain-fidelity
    category: accuracy
    name: Monetary and award-number fidelity to source
    description: >
      Total Award Amount, Total Direct Costs, Total Indirect Costs, each
      Approved Budget category amount, and the FAIN match the source document
      EXACTLY — dollar signs, commas, and decimals preserved verbatim, no
      transposed digits, and no amounts or award numbers that do not appear
      in the source document. Cross-reference every figure against the source
      text; any value not grounded there is a hallucination and must FAIL.
  - id: ac-admin-requirements-coverage
    category: completeness
    name: Key administrative requirements coverage
    description: >
      KEY ADMINISTRATIVE REQUIREMENTS contains the Reporting Requirements
      table with columns Report Type / Frequency / Due Date or Timing /
      Submission Method (one row per reporting obligation in the source),
      plus Prior Approval Required For, Audit Requirements, Record Retention,
      FFR Requirements (summary), and High-Risk Conditions. Empty categories
      use the contract defaults (e.g., "Standard 2 CFR 200.308 prior
      approvals", "None identified") instead of being omitted.
  - id: ac-markdown-formatting
    category: formatting
    name: Markdown deliverable formatting
    description: >
      Output is rendered Markdown (NOT a JSON object and NOT wrapped in a
      JSON/code fence), using bold "**Label:**" fields and three correctly
      headed tables: FINANCIAL SUMMARY (Field | Value), APPROVED BUDGET &
      RESTRICTIONS (Category | Approved Amount | Restrictions), and Reporting
      Requirements (Report Type | Frequency | Due Date / Timing | Submission
      Method). There is no surrounding code fence, no preamble, and no
      apologetic "context does not contain" prose.
  - id: ac-placeholder-discipline
    category: content
    name: Placeholder discipline for absent data
    description: >
      When a value is genuinely absent from the source, the deliverable uses
      a clear placeholder rather than inventing data or silently dropping a
      field. Accept ANY of these equivalent placeholders and do NOT fail on
      the exact wording: "Not specified", "Not specified in the document",
      "Not required", "Not required (—)", or "—". Separately, ONLY when every
      upstream field was empty must the closing warning line ("the upstream
      extraction returned no data ... re-run the workflow") be present.

steps:
  - name: Knowledge Base Context Lookup
    tasks:
      - name: kb-context-lookup
        kind: KnowledgeBaseQuery
        query: "federal award compliance framework reporting requirements prior approval audit thresholds high-risk conditions financial overview budget periods F&A rate cost sharing 2 CFR 200 Uniform Guidance deliverable schedule"
        k: 8
        knowledge_base_hint:
          title: "OMB Uniform Guidance (2 CFR 200)"
          description: >
            Primary regulatory KB. Swap in agency-specific KBs (NSF
            PAPPG, NIH GPS, DOE Financial Assistance Rules, DOD
            Research Funding & DFARS) when the award is from one of
            those agencies. Pair with Responsible Conduct of Research
            (RCR) or Export Control (EAR & ITAR) for awards with
            security or compliance specialty.

  - name: Parallel Extraction (Prompt)
    tasks:
      - name: extract-compliance-framework
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting the compliance framework from a federal
          award document. You receive the uploaded document AND any
          KB chunks.

          Be 100% accurate. Quote regulations and deadlines verbatim.
          Use null when absent.

          Emit a JSON object with these keys:

          - award_number: STRING (FAIN).
          - project_title: STRING.
          - awardee_organization: STRING.
          - performance_period: STRING.
          - reporting_requirements: JSON ARRAY of
            {report_type, frequency, due_date_or_timing, submission_method}
            objects.
          - prior_approval_requirements: JSON ARRAY of STRINGS
            (categorized prior-approval triggers — budget changes >X%,
            equipment, PI change, NCE, foreign travel).
          - audit_requirements: STRING (Single Audit threshold,
            cognizant agency).
          - record_retention: STRING (e.g., "3 years per 2 CFR 200.334").
          - high_risk_conditions: JSON ARRAY of STRINGS (any
            special-conditions language indicating high-risk
            designation). Empty when none.
          - special_conditions: JSON ARRAY of STRINGS (terms beyond
            standard federal requirements).
          - cross_cutting_federal_requirements: JSON ARRAY of STRINGS
            (2 CFR 200, agency-specific regs, RTC).

          ## Output

          Emit exactly one JSON object. No preamble, no markdown
          fences.

      - name: extract-financial-management
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting financial management details from a
          federal award document. You receive the uploaded document
          AND any KB chunks.

          Be 100% accurate. Monetary fields preserve the document's
          $X,XXX.XX format verbatim. Use null when absent.

          Emit a JSON object with these keys:

          - total_award_amount: STRING ($X).
          - total_anticipated_amount: STRING ($X). null when absent.
          - budget_periods: JSON ARRAY of
            {period_number, start_date, end_date, amount} objects.
          - budget_categories: JSON ARRAY of {category, approved_amount,
            restrictions} objects (one per category: Salary, Fringe,
            Equipment, Travel, Supplies, Subcontracts, Other, F&A).
          - total_direct_costs: STRING ($X).
          - total_indirect_costs: STRING ($X).
          - fa_rate: STRING (e.g., "56.5% MTDC"). null when absent.
          - fa_base: STRING. null when absent.
          - cost_share_amount: STRING ($X). null when not required.
          - cost_share_type: STRING. null when not required.
          - program_income: STRING. null when absent.
          - ffr_requirements: STRING (one-line summary — full FFR
            detail belongs to ffr-management-extraction-udm).

          ## Output

          Emit exactly one JSON object. No preamble, no markdown
          fences.

  - name: Consolidation (Markdown deliverable)
    is_output: true
    tasks:
      - name: award-compliance-consolidation
        kind: Prompt
        input_source: step_input
        prompt_inline: |
          You are the consolidation step of the Award Compliance &
          Financial Overview workflow. You receive TWO JSON fragments
          from the previous step.

          Render a single RA-friendly Markdown Award Compliance &
          Financial Overview. Mirrors source consolidation.md exactly.

          ## CRITICAL — ALWAYS RENDER THE DELIVERABLE

          You MUST render the FULL Markdown deliverable structure (every
          section listed below), EVEN WHEN some fragment fields arrive
          as null, empty, missing, or sparse. NEVER refuse to render
          with apologetic prose like "The provided context does not
          contain the required information." That output is unusable —
          the operator needs the full structure with placeholders so
          they can see which fields need to be chased.

          Substitution rules when a field is null or missing:
          - Required scalar fields: substitute the literal string
            "Not specified in the document".
          - Optional table cells: substitute "—" (em dash).
          - Empty arrays: render the section with its empty-state
            language already specified below (e.g., "No items identified",
            "Defers to federal defaults", "None identified beyond
            standard federal requirements").

          If EVERY field across ALL upstream fragments is null (which
          means the document genuinely contained nothing extractable
          OR the document was not attached to the run), STILL render
          the full Markdown structure with "Not specified in the
          document" placeholders throughout, AND append a single line
          at the very end of the deliverable:

          > ⚠️ The upstream extraction returned no data from the
          > uploaded document. Verify the document was attached and
          > re-run the workflow.

          ## Required structure (in this exact order)

          # Award Compliance & Financial Overview: <award_number>

          ### AWARD HEADER INFORMATION

          - **Project Title:** <project_title>
          - **Awardee Organization:** <awardee_organization>
          - **Federal Award Identification Number (FAIN):** <award_number>
          - **Period of Performance:** <performance_period>

          ---

          ### FINANCIAL SUMMARY

          | Field | Value |
          |---|---|
          | Total Award Amount | <total_award_amount> |
          | Total Anticipated Amount | <total_anticipated_amount or "Not specified"> |
          | Total Direct Costs | <total_direct_costs> |
          | Total Indirect Costs | <total_indirect_costs> |
          | F&A Rate | <fa_rate or "Not specified"> on <fa_base or "Not specified"> |
          | Cost Share | <cost_share_amount or "Not required"> (<cost_share_type or "—">) |
          | Program Income | <program_income or "Not specified"> |

          **Budget Periods:**

          One bullet per budget_periods entry:
          - Period <period_number>: <start_date> — <end_date>, <amount>

          ---

          ### APPROVED BUDGET & RESTRICTIONS

          | Category | Approved Amount | Restrictions |
          |---|---|---|

          One row per budget_categories entry.

          ---

          ### GOVERNING REGULATIONS

          Render in priority order:
          1. Cross-cutting (2 CFR 200, RTC)
          2. Agency-specific
          3. Award-specific terms

          Bulleted list combining cross_cutting_federal_requirements +
          special_conditions, sorted by priority.

          ---

          ### KEY ADMINISTRATIVE REQUIREMENTS

          **Reporting Requirements:**

          | Report Type | Frequency | Due Date / Timing | Submission Method |
          |---|---|---|---|

          One row per reporting_requirements entry.

          **Prior Approval Required For:**

          Bulleted list of prior_approval_requirements (or "Standard 2 CFR 200.308 prior approvals" when empty).

          **Audit Requirements:** <audit_requirements or "Standard Single Audit per 2 CFR 200 Subpart F">

          **Record Retention:** <record_retention or "3 years per 2 CFR 200.334">

          **FFR Requirements (summary):** <ffr_requirements or "See sponsor FFR schedule">
          *For full FFR detail, run the FFR Management Extraction workflow.*

          **High-Risk Conditions (if any):**

          Bulleted list of high_risk_conditions (or "None identified").

          ## Rendering rules

          - Bold every label with `**Label:**`.
          - Preserve monetary amounts verbatim.
          - If any field arrives as a nested JSON object, REWRITE
            into prose / table.
          - No JSON code fences around the output.

evals:
  workflow_local: true
