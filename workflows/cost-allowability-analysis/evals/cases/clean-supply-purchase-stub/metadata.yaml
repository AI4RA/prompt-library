# Case identity
case: clean-supply-purchase-stub
source: "Placeholder case shell — to be replaced with a single-expense federal award fixture (a routine, directly-allocable supply purchase against an active Uniform Guidance award) that drives the pipeline end-to-end to a clean Allowable determination with every Step 2 check passing and no regulated-activity flag."
source_url: "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"
retrieved: 2026-05-21

# Which structural features of the input documents this case exercises.
structural_features:
  - single-expense-transaction-input
  - award-terms-document-with-allowability-language
  - no-regulated-activity-implicated
  - within-period-of-performance
  - direct-cost-allocable-to-single-award

# Workflow-level behaviors this case targets. These are pipeline-level
# checks that no single component's evals can cover: the linear step model
# carrying Step 1 normalization into the Step 2 checks, the nine checks
# emitting the shared finding contract, and Step 3 synthesizing those
# findings into one Markdown determination.
workflow_features:
  - step1_normalize_and_classify_feeds_step2
  - step2_nine_checks_emit_shared_finding_contract
  - step3_determination_receives_step2_findings
  - regulated_activity_classifier_gates_protocol_approval_check
  - determination_outcome_enum_allowable_potential_missing_notallowable
  - clean_path_resolves_to_allowable
  - markdown_determination_is_workflow_output

