# Optional free-form notes on what was confirmed, what was surprising,
# what should be re-checked on the next revalidation pass.
notes: |
  Scaffolded case shell only. The expected.md (the golden Markdown
  determination), input-source.md (the synthetic expense + award-terms
  input set), and any notes.md will be added once a Sponsored Programs
  Administrator has reviewed the end-to-end Allowable path. This stub
  exists so the workflow can declare evals.workflow_local: true per
  docs/contracts.md while the real cases are assembled in
  evaluation-data-sets.

  Additional case shells should follow for the other scenarios named in
  evals/README.md once this first shell is validated and the contract has
  been exercised end-to-end:
    - Travel charge over an award per-trip cap → Not allowable via the
      award-terms conformance check.
    - Participant-incentive gift cards with no IRB records → Missing info
      with the compliance-oversight flag raised by the protocol-approval
      check (the IRB / IACUC / IBC layer that distinguishes this workflow
      from a plain 2 CFR 200 reviewer).
