# workflow. The sibling cost-allowability-analysis.vandalizer.json is
# generated by scripts/build_vandalizer_workflows.py. Do not hand-edit
# the generated JSON — update this manifest and rebuild.
#
# Runtime topology (v0.1.0):
#   Step 1  Normalize and classify
#     3 parallel Prompt tasks: expense extraction, award-terms
#     extraction, and regulated-activity classification.
#   Step 2  Run allowability checks
#     9 parallel Prompt tasks: the single-requirement allowability checks.
#   Step 3  Synthesize determination
#     1 Prompt task: the final Markdown allowability determination.

name: Federal Cost Allowability Analysis
description: >
  Reviews a single federal-grant expense for cost allowability under the
  Uniform Guidance (2 CFR 200). Step 1 normalizes the expense, extracts
  the governing award terms, and classifies whether the expense
  implicates IRB-, IACUC-, or IBC-regulated activity. Step 2 runs nine
  single-requirement checks in parallel — period of performance,
  reasonableness, allocability, consistent treatment, award-terms
  conformance, federal prior approval, documentation, selected items of
  cost, and protocol approval. Step 3 synthesizes the findings into one
  Markdown allowability determination (Allowable, Potential issue,
  Missing info, or Not allowable). The workflow is decision support and
  does not replace institutional approval, sponsor prior approval, or
  final accounting authority.

