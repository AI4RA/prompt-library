# Authored source for the Export to Banner Award Extraction Vandalizer workflow.
#
# The companion export-to-banner-extraction.vandalizer.json is generated
# from this file by scripts/build_vandalizer_workflows.py and committed
# alongside. Never hand-edit the generated JSON — update this manifest and
# rebuild.
#
# Runtime topology (v0.1.0):
#   Step 1  Parallel Extraction
#     6 Extraction tasks, each with an embedded SearchSet whose item titles
#     mirror the export-to-banner-extraction-udm@0.1.0 schema field names.
#     Mirrors the source ProcessMapping workflow's six parallel extraction
#     tasks one-for-one (award-identification, dates-and-performance,
#     sponsor-entity, budget-financial, billing-payment, reporting-special).
#   Step 2  Consolidation
#     1 Prompt task assembles the six JSON fragments into a single object
#     that validates against
#     components/export-to-banner-extraction-udm/schema.json, converts
#     quoted dollar strings to JSON numbers, normalizes the four enums,
#     and enforces the two source cross-field rules.

name: Export to Banner Award Extraction
description: >
  Uploads a fully-executed federal award document (notice of award,
  cooperative agreement, contract, or modification) and returns a single
  structured JSON object covering the six blocks needed to populate the
  VERAS Export to Banner form: award identification (FAIN, title, PI, type,
  pass-through, CFDA, NAICS, agency); dates and performance period
  (current and overall, plus multi-year periods table); sponsor entity
  classification (entity type, agency hierarchy, address, UEIs); budget
  structure (line-item categories with JSON-number amounts, F&A rate /
  base, cost share, program income); billing and payment terms (type
  enum, frequency, PMS LOC code, payment terms); and reporting / special
  requirements (reports table, record retention, carry-forward,
  prior-approval, closeout, governing regs). Output conforms to the
  export-to-banner-extraction-udm component schema. The runtime mirrors
  the ui-insight/ProcessMapping export-to-banner-extraction workflow's
  six parallel Extraction tasks plus a Consolidation Prompt.

workflow_version: 0.1.0
vandalizer_schema_version: 2
status: experimental
owner: ui-insight
created: 2026-05-20
updated: 2026-05-20

components:
  - slug: export-to-banner-extraction-udm
    pinned_version: 0.1.0

validation_plan:
  - check_id: CHK-01
    check_name: Date range consistency
    check_type: consistency
    check_description: Verify award_start_date < award_end_date and performance_period_start <= award_start_date.
    target_fields:
      - dates_and_performance.award_start_date
      - dates_and_performance.award_end_date
      - dates_and_performance.performance_period_start
      - dates_and_performance.performance_period_end
    severity: error
  - check_id: CHK-02
    check_name: Monetary amount formatting
    check_type: format
    check_description: Verify monetary amounts are emitted as JSON numbers, not quoted strings.
    target_fields:
      - budget_financial.total_award_amount
      - budget_financial.total_anticipated_amount
      - budget_financial.total_direct_costs
      - budget_financial.total_indirect_costs
    severity: error
  - check_id: CHK-03
    check_name: UEI format validation
    check_type: format
    check_description: Verify UEI follows the 12-character alphanumeric format when present.
    target_fields:
      - sponsor_entity.sponsor_uei
      - sponsor_entity.awardee_uei
    severity: warning
  - check_id: CHK-04
    check_name: CFDA number format
    check_type: format
    check_description: Verify cfda_number follows the XX.XXX format when present.
    target_fields:
      - award_identification.cfda_number
    severity: warning

steps:
  - name: Parallel Extraction
    tasks:
      - name: extract-award-identification
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting the AWARD IDENTIFICATION block of a
          fully-executed federal award document. Mirrors TASK-01 of the
          source ProcessMapping export-to-banner-extraction workflow.

          Be 100% accurate. Quote identifiers verbatim. Use null for
          fields the document does not state.

          For award_type pick exactly one of the four enum values
          (Grant, Cooperative Agreement, Contract, Subcontract).

          is_pass_through is a JSON boolean. When true, populate
          prime_sponsor_name with the prime sponsor's full name. When
          false, prime_sponsor_name is null.

          cfda_number uses the document's stated XX.XXX format. When
          multiple CFDAs apply, comma-separate them as a single string.
        searchset:
          title: Award Identification and Title Information
          domain: research-administration
          items:
            - title: award_number
              searchphrase: Federal Award Identification Number (FAIN) or sponsor award number.
            - title: project_title
              searchphrase: Full project title as stated in the award document.
            - title: pi_name
              searchphrase: Principal Investigator name as listed on the award.
            - title: award_type
              searchphrase: Award type classification (Grant, Cooperative Agreement, Contract, Subcontract).
              enum_values:
                - Grant
                - Cooperative Agreement
                - Contract
                - Subcontract
            - title: is_pass_through
              searchphrase: Whether the award is a pass-through (subaward) or a direct federal award as a JSON boolean.
            - title: prime_sponsor_name
              searchphrase: Name of the prime sponsor for pass-through awards; null for direct federal awards.
              is_optional: true
            - title: cfda_number
              searchphrase: Catalog of Federal Domestic Assistance (CFDA) / Assistance Listing number in XX.XXX format.
              is_optional: true
            - title: naics_code
              searchphrase: North American Industry Classification System code from the award header.
              is_optional: true
            - title: federal_agency_name
              searchphrase: Name of the federal awarding agency.

      - name: extract-dates-and-performance
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting the DATES AND PERFORMANCE PERIOD block of a
          fully-executed federal award document. Mirrors TASK-02 of the
          source ProcessMapping export-to-banner-extraction workflow.

          Dates use ISO YYYY-MM-DD when the document is unambiguous.
          When the document gives a qualitative form
          (e.g., "5 years from acceptance"), preserve the document's
          stated form as a string. Do not invent precision.

          award_start_date / award_end_date are the current budget
          period. performance_period_start / performance_period_end are
          the overall project period (may extend beyond the current
          budget period for multi-year incremental awards).

          budget_periods is a JSON array of
          {period_number, start_date, end_date, amount} objects, one row
          per budget period when the award is incrementally funded.
          Empty array when the award is a single-period award.

          is_multi_year is true / false / null (null when not
          determinable).
        searchset:
          title: Award Dates and Performance Period
          domain: research-administration
          items:
            - title: award_start_date
              searchphrase: Start date of the current award or budget period in ISO YYYY-MM-DD when unambiguous.
            - title: award_end_date
              searchphrase: End date of the current award or budget period in ISO YYYY-MM-DD when unambiguous.
            - title: performance_period_start
              searchphrase: Start date of the overall project performance period in ISO YYYY-MM-DD when unambiguous.
            - title: performance_period_end
              searchphrase: End date of the overall project performance period in ISO YYYY-MM-DD when unambiguous.
            - title: budget_periods
              searchphrase: Budget period rows as a JSON array of {period_number, start_date, end_date, amount} objects when multi-year incremental; empty array otherwise.
              is_optional: true
            - title: is_multi_year
              searchphrase: Whether the award spans multiple budget periods with incremental funding as a JSON boolean.
              is_optional: true

      - name: extract-sponsor-and-entity
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting the SPONSOR AND ENTITY CLASSIFICATION block
          of a fully-executed federal award document. Mirrors TASK-03 of
          the source ProcessMapping export-to-banner-extraction workflow.

          sponsor_entity_type picks exactly one of the seven enum values
          (Federal, State Government, Non-Profit, Private Industry,
          Foundation, University, Other).

          sponsor_uei / awardee_uei are 12-character alphanumeric
          strings when stated. Preserve case verbatim. Null when not
          stated in the document.
        searchset:
          title: Sponsor and Entity Classification
          domain: research-administration
          items:
            - title: sponsor_name
              searchphrase: Full legal name of the sponsoring organization.
            - title: sponsor_entity_type
              searchphrase: Sponsor entity classification (Federal, State Government, Non-Profit, Private Industry, Foundation, University, Other).
              enum_values:
                - Federal
                - State Government
                - Non-Profit
                - Private Industry
                - Foundation
                - University
                - Other
            - title: federal_agency_hierarchy
              searchphrase: Full agency hierarchy (e.g., USDA > NIFA > Agriculture and Food Research Initiative).
              is_optional: true
            - title: sponsor_address
              searchphrase: Sponsor mailing or billing address as stated in the award document.
              is_optional: true
            - title: sponsor_uei
              searchphrase: Sponsor Unique Entity Identifier as a 12-character alphanumeric string.
              is_optional: true
            - title: awardee_organization
              searchphrase: Name of the recipient institution as stated in the award.
            - title: awardee_uei
              searchphrase: Awardee Unique Entity Identifier as a 12-character alphanumeric string.
              is_optional: true

      - name: extract-budget-and-financial
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting the BUDGET AND FINANCIAL TERMS block of a
          fully-executed federal award document. Mirrors TASK-04 of the
          source ProcessMapping export-to-banner-extraction workflow.

          CRITICAL: All monetary fields are JSON NUMBERS, not quoted
          strings. Convert document language verbatim to numeric values:
            "$1,234,567.89" -> 1234567.89
            "$500,000"      -> 500000

          Numeric fields: total_award_amount, total_anticipated_amount,
          total_direct_costs, total_indirect_costs, cost_share_amount,
          budget_categories[].approved_amount.

          fa_rate is a STRING with the document's percentage notation
          (e.g., "56.5%", "30% MTDC"). fa_rate_base picks exactly one of
          MTDC, TDC, "Salary & Wages", Other, or null when the document
          does not state it.

          budget_categories is a JSON array of
          {category, approved_amount} objects, one entry per sponsor
          category. category is the exact label (e.g., "Salary",
          "Fringe", "Equipment", "Travel", "Operating/Supplies",
          "Subcontracts", "Other"). approved_amount is a JSON number.

          is_fa_waived is true when indirect costs are waived or
          limited; false when the negotiated rate applies; null when not
          determinable.
        searchset:
          title: Budget and Financial Terms
          domain: research-administration
          items:
            - title: total_award_amount
              searchphrase: Total amount of the current award action as a JSON number.
            - title: total_anticipated_amount
              searchphrase: Total anticipated funding across all periods as a JSON number; null when not specified.
              is_optional: true
            - title: budget_categories
              searchphrase: Budget breakdown by sponsor category as a JSON array of {category, approved_amount} objects with approved_amount as JSON number.
            - title: total_direct_costs
              searchphrase: Total direct costs as a JSON number; null when not specified.
              is_optional: true
            - title: total_indirect_costs
              searchphrase: Total indirect (F&A) costs as a JSON number; null when not specified.
              is_optional: true
            - title: fa_rate
              searchphrase: Facilities & Administrative (indirect cost) rate as a percentage string with base annotation (e.g., 56.5%, 30% MTDC).
              is_optional: true
            - title: fa_rate_base
              searchphrase: F&A rate base type (MTDC, TDC, Salary & Wages, Other) or null when not specified.
              is_optional: true
              enum_values:
                - MTDC
                - TDC
                - Salary & Wages
                - Other
            - title: is_fa_waived
              searchphrase: Whether indirect costs are waived or limited by the sponsor as a JSON boolean.
              is_optional: true
            - title: cost_share_amount
              searchphrase: Required cost-sharing or matching amount as a JSON number; null when not applicable.
              is_optional: true
            - title: cost_share_type
              searchphrase: Type of cost sharing (mandatory, voluntary committed, in-kind) as a string.
              is_optional: true
            - title: program_income
              searchphrase: Program income provisions and handling requirements.
              is_optional: true

      - name: extract-billing-and-payment
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting the BILLING AND PAYMENT TERMS block of a
          fully-executed federal award document. Mirrors TASK-05 of the
          source ProcessMapping export-to-banner-extraction workflow.

          billing_type picks exactly one of the four enum values
          (Cost Reimbursement, Fixed Price, Letter of Credit, Milestone).

          billing_frequency is a string (Monthly, Quarterly,
          Upon Milestone, etc.). Preserve the document's wording.

          invoice_requirements is a JSON array of strings (one per
          required item). Empty array when none specified.

          final_invoice_deadline preserves the document's wording
          (e.g., "60 days", "90 days after project end"). String.
        searchset:
          title: Billing and Payment Terms
          domain: research-administration
          items:
            - title: billing_type
              searchphrase: Type of billing arrangement (Cost Reimbursement, Fixed Price, Letter of Credit, Milestone).
              enum_values:
                - Cost Reimbursement
                - Fixed Price
                - Letter of Credit
                - Milestone
            - title: billing_frequency
              searchphrase: How often invoices should be submitted (Monthly, Quarterly, Upon Milestone).
              is_optional: true
            - title: billing_address
              searchphrase: Physical or electronic address for invoice submission.
              is_optional: true
            - title: invoice_email
              searchphrase: Email address for electronic invoice submission.
              is_optional: true
            - title: pms_loc_code
              searchphrase: Payment Management System or Letter of Credit code for federal drawdowns.
              is_optional: true
            - title: payment_terms
              searchphrase: Payment terms (e.g., Net 30, advance payment, reimbursement).
              is_optional: true
            - title: invoice_requirements
              searchphrase: Items required on invoices as a JSON array of strings.
              is_optional: true
            - title: final_invoice_deadline
              searchphrase: Deadline for submitting the final invoice after project end.
              is_optional: true
            - title: billing_contact
              searchphrase: Name and contact information for the sponsor's billing or payment office.
              is_optional: true

      - name: extract-reporting-and-special
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting the REPORTING AND SPECIAL REQUIREMENTS
          block of a fully-executed federal award document. Mirrors
          TASK-06 of the source ProcessMapping
          export-to-banner-extraction workflow.

          reporting_requirements is a JSON array of
          {report_type, frequency, due_date_or_timing, submission_method}
          objects. One entry per required report.

          prior_approval_requirements, special_terms, and
          governing_regulations are JSON arrays of strings. Empty arrays
          when not specified.

          record_retention_period, carry_forward_policy, and
          closeout_requirements are strings or null.
        searchset:
          title: Reporting and Special Requirements
          domain: research-administration
          items:
            - title: reporting_requirements
              searchphrase: Required reports as a JSON array of {report_type, frequency, due_date_or_timing, submission_method} objects.
            - title: record_retention_period
              searchphrase: Required record retention period (e.g., 3 years after final FFR).
              is_optional: true
            - title: carry_forward_policy
              searchphrase: Whether unspent funds can be carried forward to subsequent budget periods and under what conditions.
              is_optional: true
            - title: prior_approval_requirements
              searchphrase: Actions requiring prior written agency approval as a JSON array of strings.
              is_optional: true
            - title: special_terms
              searchphrase: Special terms and conditions beyond standard federal requirements as a JSON array of strings.
              is_optional: true
            - title: closeout_requirements
              searchphrase: Specific closeout requirements and timeline.
              is_optional: true
            - title: governing_regulations
              searchphrase: Governing regulations and terms referenced as a JSON array of strings.
              is_optional: true

  - name: Consolidation
    is_output: true
    tasks:
      - name: export-to-banner-extraction-consolidation
        kind: Prompt
        input_source: step_input
        prompt_inline: |
          You are the consolidation step of the Export to Banner Award
          Extraction workflow. You receive six extraction outputs from
          the previous step (award_identification, dates_and_performance,
          sponsor_entity, budget_financial, billing_payment,
          reporting_special) and must emit a SINGLE JSON object that
          validates against the export-to-banner-extraction-udm@0.1.0
          schema (schema.json in the component directory).

          ## Output contract

          Emit exactly one JSON object. No preamble, no closing commentary,
          no markdown fences. If your runtime requires fenced output, wrap
          in a single ```json ... ``` block and emit nothing outside it.

          Top-level keys (in this order): `award_identification`,
          `dates_and_performance`, `sponsor_entity`, `budget_financial`,
          `billing_payment`, `reporting_special`.

          ## Field-by-field assembly

          Pass the six extraction fragments through into the six
          top-level blocks. Apply the following normalizations.

          ### award_identification

          Required (must not be null): award_number, project_title,
          pi_name, award_type (one of the four enum values),
          is_pass_through (JSON boolean), federal_agency_name.

          prime_sponsor_name is null when is_pass_through is false.

          ### dates_and_performance

          Required: award_start_date, award_end_date,
          performance_period_start, performance_period_end. Use ISO
          YYYY-MM-DD when the document is unambiguous.

          budget_periods is required by the schema as an array. Empty
          array for single-period awards.

          ### sponsor_entity

          Required: sponsor_name, sponsor_entity_type (one of the seven
          enum values), awardee_organization.

          ### budget_financial

          Required: total_award_amount (JSON number),
          budget_categories (array of {category, approved_amount}
          objects with approved_amount as JSON number).

          CRITICAL: If any extractor surfaced a quoted dollar string
          (e.g., "$1,234,567.89"), convert it to a JSON number
          (1234567.89) here. Apply to total_award_amount,
          total_anticipated_amount, total_direct_costs,
          total_indirect_costs, cost_share_amount, every
          budget_categories[].approved_amount, every
          budget_periods[].amount.

          fa_rate remains a string. fa_rate_base picks one of MTDC, TDC,
          "Salary & Wages", Other, or null.

          ### billing_payment

          Required: billing_type (one of the four enum values).

          invoice_requirements is required by the schema as an array.
          Empty array when none specified.

          ### reporting_special

          Required: reporting_requirements (array of objects).

          prior_approval_requirements, special_terms,
          governing_regulations are required by the schema as arrays.
          Empty array when none specified.

          ## Cross-field rules (from source workflow)

          1. CFR-01 (error): award_start_date < award_end_date.
             When the document violates this, do not alter the dates —
             append a flag string to reporting_special.special_terms:
             "FLAG: award_start_date is not before award_end_date in
             the source document."

          2. CFR-02 (warning): performance_period_start <=
             award_start_date. When the document violates this,
             do not alter the dates — append a flag string to
             reporting_special.special_terms:
             "FLAG: performance_period_start is later than
             award_start_date in the source document."

          ## Quality bar

          - Output validates against schema.json (draft 2020-12).
          - award_type, sponsor_entity_type, fa_rate_base, and
            billing_type are exact enum matches.
          - All monetary fields are JSON numbers.
          - Booleans are JSON booleans.
          - Dates use ISO YYYY-MM-DD when unambiguous.
          - Required arrays (budget_categories, budget_periods,
            invoice_requirements, reporting_requirements,
            prior_approval_requirements, special_terms,
            governing_regulations) are always emitted; use [] when
            empty rather than null.

evals:
  workflow_local: true
