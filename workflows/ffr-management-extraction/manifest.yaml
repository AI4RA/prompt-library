# Authored source for the FFR Management Extraction Vandalizer workflow.
#
# The companion ffr-management-extraction.vandalizer.json is generated from
# this file by scripts/build_vandalizer_workflows.py and committed alongside.
# Never hand-edit the generated JSON — update this manifest and rebuild.
#
# Runtime topology (v0.1.0):
#   Step 1  Extraction
#     1 Extraction task with an embedded SearchSet whose item titles mirror
#     the ffr-management-extraction-udm@0.1.0 schema field names. Mirrors
#     TASK-01 of the source ProcessMapping workflow.
#   Step 2  Consolidation
#     1 Prompt task assembles the JSON fragment into a single object that
#     validates against components/ffr-management-extraction-udm/schema.json
#     and normalizes the submission_system.platform enum.

name: FFR Management Extraction
description: >
  Uploads a federal award notice or agreement and returns a single structured
  JSON object covering the five buckets a sponsored-programs analyst uses
  when preparing FFR (SF-425) submissions: submission schedule, submission
  system and procedures, required financial data, compliance consequences,
  and preparation timeline. Output conforms to the
  ffr-management-extraction-udm component schema. The runtime mirrors the
  ui-insight/ProcessMapping ffr-management-extraction workflow (one
  Extraction task plus a Formatting/Consolidation task).

workflow_version: 0.1.0
vandalizer_schema_version: 2
status: experimental
owner: ui-insight
created: 2026-04-30
updated: 2026-04-30

components:
  - slug: ffr-management-extraction-udm
    pinned_version: 0.1.0

validation_plan:
  - check_id: CHK-01
    check_name: Date format checks
    check_type: format
    check_description: Verify all dates and day-counts (annual FFR due, final FFR due, interim cadence) preserve the document's exact wording.
    target_fields:
      - submission_schedule.annual_ffr_due
      - submission_schedule.final_ffr_due
      - submission_schedule.interim_reporting
    severity: error
  - check_id: CHK-02
    check_name: Deadline consistency
    check_type: consistency
    check_description: Verify final_ffr_due is consistent with annual_ffr_due (e.g., if annual is 90 days, final is at least 90 days; if document specifies different cadences, both are captured).
    target_fields:
      - submission_schedule.annual_ffr_due
      - submission_schedule.final_ffr_due
    severity: warning

steps:
  - name: Extraction
    tasks:
      - name: extract-ffr-management
        kind: Extraction
        input_source: workflow_documents
        prompt_inline: |
          You are extracting Federal Financial Report (FFR / SF-425)
          requirements and post-award financial reporting obligations from a
          federal award notice or agreement.

          Be 100% accurate. For each searchset item, return the value as the
          document states it. Quote dollar amounts and day-counts verbatim
          ("90 days", not "three months"). Use null when a field is not
          present — never invent values.

          Search the entire document with attention to sections titled
          "Financial Reporting Requirements", "SF-425", "Federal Financial
          Report", "Payment Management System", "Reporting Schedule", or
          "Financial Monitoring". Keywords to follow: FFR, SF-425, financial
          report, PMS, expenditure, deadline, submit, days, budget period,
          project end, liquidation, drawdown.

          For submission_system_platform return one of: Payment Management
          System, ASAP, ACH, Grants.gov, Other. Use Other only when the
          document names a platform that is none of the listed values.

          Each searchset item maps to a top-level schema field used by the
          downstream Consolidation Prompt; preserve sponsor terminology and
          do not synthesize a preparation_timeline from generic best
          practices — populate that table only when the document itself
          describes a countdown.
        searchset:
          title: FFR Management Extraction
          domain: research-administration
          items:
            - title: award_number
              searchphrase: Federal Award Identification Number (FAIN) printed on the award.
            - title: pi_name
              searchphrase: Principal Investigator full name printed on the award.
            - title: annual_ffr_due
              searchphrase: Annual FFR due window (e.g., 90 or 120 days after each budget period end). Quote the document verbatim.
            - title: final_ffr_due
              searchphrase: Final FFR deadline after project end (e.g., 120 days after project end).
            - title: interim_reporting
              searchphrase: Interim financial reporting requirements when imposed.
              is_optional: true
            - title: cash_transaction_reporting
              searchphrase: SF-272 or cash transaction reporting requirements.
              is_optional: true
            - title: submission_system_platform
              searchphrase: Primary submission system / platform (one of Payment Management System, ASAP, ACH, Grants.gov, Other).
              enum_values:
                - Payment Management System
                - ASAP
                - ACH
                - Grants.gov
                - Other
            - title: submission_system_access_requirements
              searchphrase: Account, role, or registration prerequisites for accessing the platform.
              is_optional: true
            - title: era_commons_integration
              searchphrase: eRA Commons integration details (NIH/HHS awards). Null otherwise.
              is_optional: true
            - title: submission_authorization
              searchphrase: Roles and responsibilities for who may submit (e.g., AOR-only).
              is_optional: true
            - title: required_financial_data
              searchphrase: Flat list of required reporting category labels exactly as the document names them (Personnel, Fringe, Equipment, Subawards, Cost share, Program income, etc.).
            - title: late_submission_penalties
              searchphrase: Document language describing penalties for late FFR submission.
              is_optional: true
            - title: account_restrictions
              searchphrase: Document language describing payment-system or drawdown restrictions tied to non-compliance.
              is_optional: true
            - title: impact_on_future_funding
              searchphrase: Document language describing impact on future awards or competing renewals.
              is_optional: true
            - title: required_documentation
              searchphrase: Document language describing supporting documentation or backup the recipient must retain.
              is_optional: true
            - title: preparation_timeline
              searchphrase: Countdown of preparation milestones derived from the document's own pre-submission timing language. Empty when the document does not describe a countdown.
              is_optional: true

  - name: Consolidation
    is_output: true
    tasks:
      - name: ffr-management-consolidation
        kind: Prompt
        input_source: step_input
        prompt_inline: |
          You are assembling the FFR Management Extraction output. The input
          is the JSON fragment produced by the upstream Extraction task. Your
          job is to emit a single JSON object that validates against the
          ffr-management-extraction-udm@0.1.0 schema.

          Top-level shape:
          {
            "award_number": string|null,
            "pi_name": string|null,
            "submission_schedule": {
              "annual_ffr_due": string|null,
              "final_ffr_due": string|null,
              "interim_reporting": string|null,
              "cash_transaction_reporting": string|null
            },
            "submission_system": {
              "platform": "Payment Management System"|"ASAP"|"ACH"|"Grants.gov"|"Other"|null,
              "access_requirements": string|null,
              "era_commons_integration": string|null,
              "submission_authorization": string|null
            },
            "required_financial_data": string[],
            "compliance_consequences": {
              "late_submission_penalties": string|null,
              "account_restrictions": string|null,
              "impact_on_future_funding": string|null,
              "required_documentation": string|null
            },
            "preparation_timeline": {milestone, days_before_period_end, action, owner}[]
          }

          Rules:
          1. Map each Extraction searchset item to its corresponding
             top-level schema field. submission_system_* items collapse into
             the nested submission_system object; the four
             compliance_consequences items collapse into that nested object;
             the four submission_schedule items collapse into that nested
             object.
          2. Normalize submission_system.platform to the closest enum value;
             use Other only when the document explicitly names a platform
             outside the enum list.
          3. preparation_timeline must be an array of objects. If the
             extraction returned a string description, parse it into one or
             more {milestone, days_before_period_end, action, owner} entries
             only when the document itself describes a countdown. Otherwise
             return an empty array.
          4. required_financial_data must be a flat list of category label
             strings. Reject any nested objects.
          5. Use null for missing scalar fields; never invent values.
          6. Do not output any text outside the single JSON object.

evals:
  workflow_local: true
