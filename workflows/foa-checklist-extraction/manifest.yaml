# Authored source for the FOA Checklist Extraction Vandalizer workflow.
#
# === Topology (v0.2.0, Variant A + KB injection) ===
#
# v0.2.0 changes vs. v0.1.0:
#   1. Parallel Extraction tasks converted to Prompt tasks.
#   2. Output contract: RA-friendly Markdown FOA reference document with
#      ToC, eight sections (FOA Summary, Key Dates, Funding, Eligibility,
#      Application Components, Evaluation, Priorities, Special Reqs) per
#      source consolidation.md.
#   3. Step 0 KnowledgeBaseQuery added.

name: FOA Checklist Extraction
description: >
  Uploads a federal funding opportunity announcement (FOA / NOFO) and
  returns an RA-friendly Markdown FOA reference document covering FOA
  Summary, Key Dates and Deadlines, Funding Information, Eligibility
  Requirements, Application Components and Submission Requirements,
  Evaluation Process and Criteria, Program Priorities and Alignment,
  and Special Requirements. Mirrors the source
  ui-insight/ProcessMapping foa-checklist-extraction consolidation.md
  conventions, including the Table of Contents at the top and
  H1/H2/H3 hierarchical headings.

workflow_version: 0.2.0
vandalizer_schema_version: 2
status: experimental
owner: ui-insight
created: 2026-04-30
updated: 2026-05-22

components:
  - slug: foa-checklist-extraction-udm
    pinned_version: 0.1.0

validation_plan:
  - check_id: CHK-01
    check_name: Date / deadline preservation
    check_type: format
    check_description: Verify dates preserve the FOA's stated granularity and timezone.
    target_fields: []
    severity: error
  - check_id: CHK-02
    check_name: Cross-field consistency
    check_type: consistency
    check_description: Verify expected_awards × max(award_range) ≤ total_funding when all three are stated.
    target_fields: []
    severity: warning
  - check_id: CHK-03
    check_name: Evaluation-criteria weights sum
    check_type: arithmetic
    check_description: Verify the sum of evaluation-criteria weights equals 100% when weights are stated as percentages.
    target_fields: []
    severity: warning

steps:
  - name: Knowledge Base Context Lookup
    tasks:
      - name: kb-context-lookup
        kind: KnowledgeBaseQuery
        query: "federal funding opportunity announcement FOA NOFO eligibility budget cost sharing F&A indirect cost rates allowable unallowable personnel effort submission deadlines compliance evaluation criteria peer review CFDA program authorization"
        k: 8
        knowledge_base_hint:
          title: "OMB Uniform Guidance (2 CFR 200)"
          description: >
            Primary regulatory KB. Swap in NSF PAPPG Reference (NSF
            FOAs), NIH Grants Policy Statement (NIH NOFOs), DOE
            Financial Assistance Rules (DOE), or DOD Research Funding
            & DFARS (DOD) as appropriate for the announcement's
            sponsor.

  - name: Parallel Extraction (Prompt)
    tasks:
      - name: extract-foa-summary
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting FOA summary fields. You receive the
          uploaded document AND any KB chunks.

          Emit a JSON object with: foa_number_or_id, cfda_number,
          cfda_title, federal_agency, agency_office_bureau,
          foa_title_or_program_name, program_authorization,
          program_description (1-3 sentence summary). All STRINGS;
          null when absent.

          ## Output
          Emit exactly one JSON object. No preamble, no markdown
          fences.

      - name: extract-key-dates
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting key dates and deadlines from a FOA.
          Preserve the sponsor's date format verbatim including time
          and timezone.

          Emit a JSON object with one key: critical_dates (JSON ARRAY
          of {event_or_milestone, date_time, notes_or_requirements}
          objects sorted chronologically).

          ## Output
          Emit exactly one JSON object. No preamble, no markdown
          fences.

      - name: extract-funding-information
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting funding information from a FOA. Preserve
          monetary amounts verbatim ($X,XXX,XXX format).

          Emit a JSON object with: total_funding (STRING), expected_awards
          (STRING — e.g., "10-15"), award_size_range (STRING — e.g.,
          "$100,000 to $500,000"), project_duration (STRING),
          cost_sharing_required (BOOLEAN or null), cost_sharing_details
          (STRING or null), award_instrument_type (STRING — Grant /
          Cooperative Agreement / Contract).

          ## Output
          Emit exactly one JSON object. No preamble, no markdown
          fences.

      - name: extract-eligibility
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting eligibility requirements from a FOA.

          Emit a JSON object with: eligible_applicants (JSON ARRAY of
          STRINGS), ineligible_applicants (JSON ARRAY of STRINGS or
          empty), per_institution_limit (STRING or null),
          per_pi_limit (STRING or null), special_eligibility_conditions
          (JSON ARRAY of STRINGS).

          ## Output
          Emit exactly one JSON object. No preamble, no markdown
          fences.

      - name: extract-application-and-evaluation
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting application components, submission
          requirements, and evaluation criteria from a FOA.

          Emit a JSON object with:
          - registration_requirements: JSON ARRAY of STRINGS
            (SAM.gov, Grants.gov, eRA Commons, etc.).
          - required_forms: JSON ARRAY of STRINGS.
          - formatting_requirements: STRING (page limits, font,
            margins).
          - required_components: JSON ARRAY of
            {component_name, description, page_limit_or_format}
            objects.
          - submission_method: STRING (portal / email / hardcopy).
          - screening_criteria: JSON ARRAY of STRINGS.
          - merit_review_criteria: JSON ARRAY of
            {criterion, weight, description} objects.
          - review_timeline: STRING.

          ## Output
          Emit exactly one JSON object. No preamble, no markdown
          fences.

      - name: extract-priorities-and-special
        input_sources:
          - step_input
          - workflow_documents
        prompt_inline: |
          You are extracting program priorities and special requirements
          from a FOA.

          Emit a JSON object with: primary_goals (JSON ARRAY of
          STRINGS), priority_areas (JSON ARRAY of STRINGS),
          expected_outcomes (JSON ARRAY of STRINGS),
          alignment_recommendations (STRING),
          special_requirements (JSON ARRAY of STRINGS — unique aspects
          not fitting other sections).

          ## Output
          Emit exactly one JSON object. No preamble, no markdown
          fences.

  - name: Consolidation (Markdown deliverable)
    is_output: true
    tasks:
      - name: foa-checklist-consolidation
        kind: Prompt
        input_source: step_input
        prompt_inline: |
          You are the consolidation step of the FOA Checklist
          Extraction workflow. You receive SIX JSON fragments from the
          previous step.

          Render a single RA-friendly Markdown FOA reference document.
          Mirrors source consolidation.md exactly, including the H1/H2/H3
          hierarchy and the table of contents at the top.

          ## CRITICAL — ALWAYS RENDER THE DELIVERABLE

          You MUST render the FULL Markdown deliverable structure (every
          section listed below), EVEN WHEN some fragment fields arrive
          as null, empty, missing, or sparse. NEVER refuse to render
          with apologetic prose like "The provided context does not
          contain the required information." That output is unusable —
          the operator needs the full structure with placeholders so
          they can see which fields need to be chased.

          Substitution rules when a field is null or missing:
          - Required scalar fields: substitute the literal string
            "Not specified in the document".
          - Optional table cells: substitute "—" (em dash).
          - Empty arrays: render the section with its empty-state
            language already specified below (e.g., "No items identified",
            "Defers to federal defaults", "None identified beyond
            standard federal requirements").

          If EVERY field across ALL upstream fragments is null (which
          means the document genuinely contained nothing extractable
          OR the document was not attached to the run), STILL render
          the full Markdown structure with "Not specified in the
          document" placeholders throughout, AND append a single line
          at the very end of the deliverable:

          > ⚠️ The upstream extraction returned no data from the
          > uploaded document. Verify the document was attached and
          > re-run the workflow.

          ## Required structure (in this exact order)

          # FOA Reference: <foa_title_or_program_name>

          ## Table of Contents

          1. FOA Summary
          2. Key Dates and Deadlines
          3. Funding Information
          4. Eligibility Requirements
          5. Application Components and Submission Requirements
          6. Evaluation Process and Criteria
          7. Program Priorities and Alignment
          8. Special Requirements

          ---

          ## FOA Summary

          Render a concise summary block:

          - **FOA Number/ID:** <foa_number_or_id or "Not specified">
          - **CFDA Number / Title:** <cfda_number or "Not specified"> — <cfda_title or "—">
          - **Federal Agency:** <federal_agency> (<agency_office_bureau or "—">)
          - **FOA Title / Program Name:** <foa_title_or_program_name>
          - **Program Authorization:** <program_authorization or "Not specified">

          <program_description as a paragraph>

          ---

          ## Key Dates and Deadlines

          | Event / Milestone | Date and Time | Notes / Requirements |
          |---|---|---|

          One row per critical_dates entry, sorted chronologically.
          Use **bold** for critical deadlines.

          ---

          ## Funding Information

          - **Total Available Funding:** <total_funding>
          - **Number of Anticipated Awards:** <expected_awards>
          - **Award Size:** <award_size_range>
          - **Project Duration:** <project_duration>
          - **Cost Sharing Required:** <Yes / No / Not specified>
          - **Cost Sharing Details:** <cost_sharing_details or "—">
          - **Award Instrument Type:** <award_instrument_type>

          ---

          ## Eligibility Requirements

          ### Who can apply

          Bulleted list from eligible_applicants.

          ### Who cannot apply

          Bulleted list from ineligible_applicants (or "Not specified
          in the document").

          ### Limitations

          - **Per Institution:** <per_institution_limit or "Not specified">
          - **Per PI:** <per_pi_limit or "Not specified">

          ### Special Eligibility Conditions

          Bulleted list from special_eligibility_conditions (or "None").

          ---

          ## Application Components and Submission Requirements

          ### Registration Requirements

          Bulleted list from registration_requirements.

          ### Required Forms

          Bulleted list from required_forms.

          ### Formatting Requirements

          <formatting_requirements>

          ### Required Components Checklist

          | Component | Description | Page Limit / Format |
          |---|---|---|

          One row per required_components entry.

          ### Submission Method

          <submission_method>

          ---

          ## Evaluation Process and Criteria

          ### Screening Criteria

          Bulleted list from screening_criteria.

          ### Merit Review Criteria

          | Criterion | Weight | Description |
          |---|---|---|

          One row per merit_review_criteria entry.

          ### Review Timeline

          <review_timeline>

          ---

          ## Program Priorities and Alignment

          ### Primary Goals

          Bulleted list from primary_goals.

          ### Priority Areas

          Bulleted list from priority_areas.

          ### Expected Outcomes

          Bulleted list from expected_outcomes.

          ### Alignment Recommendations

          <alignment_recommendations>

          ---

          ## Special Requirements

          Bulleted list from special_requirements. If empty, state
          "None identified beyond standard federal requirements."

          ## Rendering rules

          - H1 for the title, H2 for major sections, H3 for sub-sections
            (matches source convention).
          - Bold critical deadlines and key requirements.
          - Preserve dates and monetary amounts verbatim.
          - Horizontal rules between major sections.
          - If any field arrives as a nested JSON object, REWRITE
            into prose / table.
          - No JSON code fences around the output.

evals:
  workflow_local: true
