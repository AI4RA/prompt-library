# Authored source for the RFA Checklist Extraction Vandalizer workflow.
#
# The companion rfa-checklist-extraction.vandalizer.json is generated from this
# file by scripts/build_vandalizer_workflows.py and committed alongside.
# Never hand-edit the generated JSON — update this manifest and rebuild.
#
# === Variant A topology (v2.0.0) ===
#
# v2.0.0 (2026-08-13) — TASK SPLIT for the 8192-token model context.
# The v1.2.0 import failed with "Model token limit (8192) exceeded
# before any response was generated": extract-application-components
# had accreted to ~20.8K chars (~5.2K tokens) of prompt across three
# fix iterations, which plus the attached document slice and the
# reserved output budget exceeded the assigned model's total 8192-token
# window — the call was rejected before generating anything. (The
# consolidation is NOT affected: it demonstrably consumed ~7.5K input
# tokens and produced ~2.6K output tokens in runs 3–4, so it runs on a
# larger-context assignment.) Changes:
#   1. NEW parallel task extract-mandated-structure (10th task) owns
#      announcement-mandated internal component structure — emits
#      {mandated_structure:[{component, mandated_sections:[...]}]}
#      with a compact worked example. Prompt ~4.5K chars (~1.1K tok).
#   2. extract-application-components rewritten WITHOUT the
#      mandated-sections rules/example — backbone merge + stubs +
#      compactness only. Prompt 20.8K → ~9.5K chars (~2.4K tokens),
#      comfortably inside 8192 with a document slice + output budget.
#   3. Consolidation: TEN fragments; the Announcement-Mandated
#      Structure block and the "See required structure below." table
#      pointer now read fragment 10 (match on component name);
#      fragment 7 components no longer carry mandated_sections.
#   4. MAJOR: parallel task count 9 → 10, fragment count 9 → 10.
#
# v1.2.0 (2026-08-13) — COMPACTNESS-BLOCK PLACEMENT FIX + BACKBONE
# STUBS. The v1.1.0 NSF 25-541 re-test fixed fragment truncation but
# surfaced two regressions caused by the compactness block itself:
#   1. PROMPT-TAIL DISPLACEMENT: the block was appended AFTER the
#      "## Output" schema section, so it became the final instruction.
#      The extract-risk-flags model latched onto "emit minified JSON",
#      claimed "no schema was provided", and returned conversational
#      prose — collapsing RED FLAGS to a false "no red flags
#      identified". Fix: the block now sits BEFORE "## Output" (schema
#      is always the last instruction) and every prompt ends with an
#      anti-chat anchor ("Begin your reply with `{` ... no questions,
#      no offers to help").
#   2. BACKBONE DROPPED / CONTENT OVER-COMPRESSION: the model treated
#      "spend your budget on announcement-specific content" as license
#      to omit the 10 backbone components entirely (1-row table), and
#      the award task shortened "Up to $5M/year for 4 years..." to
#      "$20M per PCL Node". Fix: "minify the SYNTAX only — never
#      shorten content values"; backbone components are now emitted as
#      STUBS ({name, source} only, ~60 chars each — no budget excuse
#      to drop them) with an explicit NEVER-drop rule and the run-3
#      failure as the WRONG example. The consolidation renders stub
#      rows with "—" cells and never invents descriptions.
#   3. Deliverable economy: Important Notes tightened to 0–3 bullets
#      (run-3 consolidation clipped its final line at the cap).
#
# v1.1.0 (2026-08-13) — OUTPUT-TOKEN ECONOMY. Surfaced by two NSF
# 25-541 runs that truncated mid-string at hard output-token caps the
# operator cannot raise: run 1 cut the consolidation deliverable at
# ~9.3K chars; run 2 (different model assignment) cut the
# extract-application-components fragment at ~4.9K chars, destroying
# everything after the cut (backbone components, submission_details,
# formatting_requirements, the last Implementation Timeline
# milestones). Changes:
#   1. All 9 extraction tasks: new "Output compactness (CRITICAL)"
#      block — emit MINIFIED single-line JSON (fragments are
#      mid-pipeline, never human-read; the pretty-printed run-2
#      fragment spent ~35% of its budget on indentation).
#   2. extract-application-components (largest fragment): emit cheap
#      scalar keys first (submission_details, formatting_requirements,
#      special_requirements) then required_components with
#      "Announcement"-sourced components (carrying mandated_sections)
#      before pure backbone rows — so a future cap-hit clips low-value
#      tail content, not the announcement-unique payload. Omit
#      null-valued component keys; backbone descriptions ≤12 words;
#      mandated_sections requirements ≤~30 words (compress wording,
#      never drop an enumerated sub-part / column / milestone).
#   3. Consolidation: fragment 7 spec notes minified/reordered/
#      key-omitted arrivals (missing key == null); new salvage rule —
#      a truncated/malformed fragment is parsed for every salvageable
#      field, never discarded.
#
# v1.0.0 (2026-08-13) REMOVES the optional Knowledge Base lookup step
# (Step 0, added in v0.4.0). MAJOR: step-structure change (3 steps → 2).
# Rationale: the RA's live Vandalizer copy never carried the step, KBs
# are never auto-wired on import anyway (kb_uuid is blanked by design,
# so the operator must attach one manually — exactly what the README's
# "Recommended knowledge bases" section already documents), and the
# inert step confused operators comparing the imported workflow to
# their working copy. The parallel extraction tasks now read
# input_sources: [workflow_documents] only (step_input removed — with
# no preceding step it contributed nothing). Operators who want
# Uniform Guidance / PAPPG context can still add a KnowledgeBaseQuery
# step manually in the Vandalizer UI after import, per the README.
#
# v0.8.0 (2026-08-13) adds ANNOUNCEMENT-MANDATED INTERNAL STRUCTURE
# (mandated_sections). Surfaced by NSF 25-541 (PCL Test Bed): the
# solicitation's Section V.A supplements the PAPPG with ten named
# Project Description sections (Science drivers; Node capabilities with
# five numbered sub-parts incl. the Instrument Inventory Table;
# Cross-Node Collaborations; Training and education; Broadening access;
# Metrics; Management Plan with a six-milestone Implementation
# Timeline; Plan for Post-Award Continued Operation), and the v0.7.0
# extraction compressed all of it into one description sentence plus
# the pointer "Must include all specified subsections listed in
# Section V.A" — useless without the announcement open.
#   1. extract-application-components: component objects gain a
#      `mandated_sections` field ({name, requirements, subsections})
#      with enumeration rules (announcement order, names verbatim,
#      sub-parts / table columns / milestones spelled out), an explicit
#      ban on pointer-only phrasing, and a WRONG vs CORRECT worked
#      example built from the observed NSF 25-541 failure.
#   2. rfa-checklist-consolidation: renders a "📋 Required structure:
#      <Component>" block after the Required Components table for every
#      component carrying mandated_sections; the component's Special
#      Requirements cell points to it; placement contract rule 6 keeps
#      the enumeration out of top-level SPECIAL REQUIREMENTS. Block is
#      omitted entirely when no component has mandated structure.
#   3. validation_plan: new CHK-07 (mandated structure enumerated, no
#      pointer substitution).
#
# v0.7.0 (2026-08-13) expands per the RA follow-up email's .docx
# ("Examples of items to include in RFA"):
#   1. RED FLAGS EXPANSION — extract-risk-flags now checks the full
#      trigger set from the SPA checklist: 5 escalation flags PLUS the
#      Contract Review Unit (CRU) triggers (indemnification; IP / data
#      ownership; publication restrictions; insurance; NDA; FAR /
#      contract-type terms; governing law of another state; acceptance of
#      T&C on submission; restricted country / foreign ownership; foreign
#      government or national-lab contracting (JPL/INL); CUI / classified;
#      other unusual T&C). Each check is tagged category "escalation" or
#      "cru"; when any CRU trigger fires, the banner adds the "route to
#      Contract Review Unit via VERAS" action.
#   2. NEW extract-compliance-flags task → two new sections: COMPLIANCE
#      RISKS (human subjects, animals, biosafety, export control, select
#      agents, CUI, data security, national security) and FOREIGN
#      INFLUENCE & INTERNATIONAL COMPONENTS (foreign collaborators /
#      subawards / travel, talent-program certs, international data
#      sharing, country restrictions).
#   3. Field enrichments: metadata gains funding_instrument_type; budget
#      explicitly hunts salary/tuition/equipment/participant/travel/food/
#      incentive/publication rules; eligibility adds subrecipient
#      eligibility + limited-submission mechanics; submission names the
#      specific portal.
# All new prompts carry explicit anti-hallucination guards (ground every
# assertion in the document; "unclear" not "no" when unaddressed; never
# infer a typical federal value). The parallel step now runs 9 tasks;
# the deliverable has 11 sections.
#
# v0.6.0 (2026-08-13) added the SPONSOR BACKBONE (RA follow-up email).
# The extract-application-components task now carries a baked-in
# reference of each federal sponsor's (NSF / NIH / USDA-NIFA / DOE /
# NASA) standard required proposal components + standard formatting. It
# detects the sponsor from the document and MERGES the standard
# components into the output even when the announcement does not list
# them, tagging each component's provenance in a new `source` field
# (Announcement / Sponsor standard / Announcement + sponsor standard).
# A new `formatting_requirements` field applies the precedence rule:
# use the announcement's stated formatting, else fall back to the
# sponsor default (prefixed "Sponsor default (<SPONSOR>):"). Non-federal
# sponsors (e.g., a state agency) get no backbone — output reflects only
# what the announcement states. Consolidation renders a Source column in
# the components tables and a Formatting Requirements subsection. No
# topology change: still 8 parallel tasks + consolidation.
#
# v0.5.0 (2026-08-13) applied the first round of pre-award RA feedback:
#   1. NEW "RED FLAGS" section at the TOP of the deliverable, fed by a
#      new dedicated `extract-risk-flags` parallel task. It explicitly
#      hunts the escalation triggers that make a submission
#      higher-effort or longer-lead-time (cost share, F&A limit/waiver,
#      institutional/executive commitment letter, limited submission,
#      contract-review terms like indemnification/IP, AOR signature /
#      institution-must-submit) so an RA sees them first and can start
#      the long-pole processes early.
#   2. Section REORDER to match how RAs triage: Red Flags -> Dates ->
#      Eligibility -> Award Information -> Budget (moved up, now adjacent
#      to Award) -> Submission Details (moved before Application
#      Components) -> Application Components -> Special Requirements ->
#      Important Notes.
#   3. Dates task now RESOLVES recurring / relative deadline rules
#      ("second Tuesday in September", recurring annually) to concrete
#      calendar dates, keeping the original rule text in `notes`.
#   4. Eligibility tasks now explicitly capture limited-submission caps
#      (per institution and per individual), citizenship, career-stage,
#      and required certifications / credentials.
# The parallel step therefore now carries EIGHT Prompt tasks and the
# Consolidation step parses EIGHT JSON fragments.
#
# v0.4.0 added an optional Knowledge Base lookup as Step 0. The parallel
# extraction Prompt tasks now read input_sources: [step_input,
# workflow_documents] — combining the KB chunks (when the operator
# attaches a KB in Vandalizer's UI post-import) with the uploaded RFA
# PDF. The kb_uuid is blanked at workflow design time; Vandalizer's
# importer turns the knowledge_base_hint into a UI prompt telling the
# operator which KB title to attach. If the operator skips KB
# attachment, KnowledgeBaseQueryNode returns empty output gracefully,
# and the parallel tasks fall back to reading just workflow_documents
# (the PDF). The workflow runs end-to-end whether or not a KB is
# attached.
#
# Architectural change vs. v0.2.0: the parallel "Extraction" tasks were
# converted from Vandalizer Extraction tasks (SearchSet-driven keyword
# retrieval) to Vandalizer Prompt tasks (full-document LLM reading).
# Grant documents rarely use the literal field labels SearchSet
# retrieval expects ("Due Date", "Eligibility") — they use varied
# phrasings ("Full Proposal Deadline", "Eligible Applicants"), which
# broke keyword-based extraction and produced empty fragments. Prompt
# tasks pass the full OCR'd document into the LLM, which then reads
# with NLU and finds the right content regardless of wording.
#
# Output contract change vs. v0.2.0: the Consolidation step now emits
# RA-friendly Markdown (a Red-Flags-led, multi-section RFA checklist
# based on the source ui-insight/ProcessMapping rfa-checklist-extraction
# consolidation.md conventions) rather than schema-conformant JSON. The
# rfa-checklist-extraction-udm COMPONENT remains JSON-emitting and is
# the evaluation-harness target; this WORKFLOW is the Vandalizer
# end-user (sponsored-programs analyst) deliverable.
#
# Step 1  Parallel Prompt
#   10 Prompt tasks, each receiving input_sources: [workflow_documents]
#   (the uploaded RFA). One metadata task captures the UDM-aligned
#   scalar opportunity fields; a risk-flags task hunts the escalation +
#   CRU triggers for the Red Flags banner; a compliance-flags task
#   feeds the Compliance Risks and Foreign Influence sections; a
#   mandated-structure task extracts announcement-mandated internal
#   component structure; the other six mirror the source workflow's
#   six parallel extractions. Each task emits a JSON FRAGMENT for its
#   block (Variant A mid-pipeline format).
# Step 2  Consolidation (Markdown deliverable)
#   1 Prompt task assembles the ten JSON fragments and renders a
#   single Markdown checklist with eleven sections (Red Flags first),
#   enforcing the strict-de-duplication placement contract from source.

name: RFA Checklist Extraction
description: >
  Uploads a federal funding announcement (RFA, FOA, NOFO, or program
  solicitation) and returns a single RA-friendly Markdown checklist
  organized in the pre-award sections a sponsored-programs analyst uses
  when triaging an opportunity, led by a Red Flags section that surfaces
  escalation and contract-review triggers first: Red Flags, Dates &
  Deadlines, Eligibility, Award Information, Budget Requirements &
  Policies, Submission Details, Application Components, Compliance Risks,
  Foreign Influence & International Components, Special Requirements, and
  Important Notes. The pipeline runs ten parallel Prompt tasks (each
  emitting a JSON fragment for its block) plus a Consolidation Prompt
  that renders the
  final Markdown checklist with strict de-duplication. Mirrors the
  ui-insight/ProcessMapping rfa-checklist-extraction workflow's
  consolidated sections and placement contract, extended with the
  2026-08 pre-award RA feedback (Red Flags, section reorder, recurring
  date resolution, richer eligibility) and a baked-in sponsor backbone
  that auto-includes each federal sponsor's standard required components
  and default formatting when the announcement omits them. v0.7.0 adds
  the expanded Red Flags / Contract-Review trigger set and Compliance
  Risks + Foreign Influence sections from the RA's SPA checklist.

workflow_version: 2.0.1
vandalizer_schema_version: 2
status: experimental
owner: ui-insight
created: 2026-04-24
updated: 2026-08-13

components:
  - slug: rfa-checklist-extraction-udm
    pinned_version: 0.1.0

validation_plan:
  - id: CHK-01
    name: Eleven sections present
    category: completeness
    description: Verify the Markdown deliverable contains all eleven sections in order (Red Flags, Dates & Deadlines, Eligibility, Award Information, Budget Requirements & Policies, Submission Details, Application Components, Compliance Risks, Foreign Influence & International Components, Special Requirements, Important Notes).
  - id: CHK-02
    name: Placement contract enforcement
    category: accuracy
    description: >
      Verify each key fact has a clear PRIMARY home and that sections do not
      CONTRADICT each other: (a) award amount and duration are present in AWARD
      INFORMATION; (b) the detailed financial rules (cost-share / matching, F&A /
      indirect, funding limits, allowable costs) are present in BUDGET REQUIREMENTS
      & POLICIES. The RED FLAGS section is the one deliberate exception: it MAY
      carry a SHORT pointer to a financial trigger (e.g. "Cost share required — see
      Budget") without restating the detailed rule, and this pointer redundancy is
      ACCEPTABLE and must NOT fail. Elsewhere a figure or rule MAY also be
      referenced in a second section where it is contextually relevant. FAIL only
      if a primary placement is MISSING (amount/duration absent from Award
      Information, or the financial rules absent from Budget), or if two sections
      state CONTRADICTORY values for the same fact.
  - id: CHK-03
    name: Monetary amount preservation
    category: formatting
    description: Verify monetary amounts preserve the sponsor's original currency formatting (dollar signs, commas, basis annotation).
  - id: CHK-04
    name: Eligibility completeness
    category: completeness
    description: Verify both Eligible Institutions and Eligible Individuals subsections are present and non-empty.
  - id: CHK-05
    name: Red Flags section grounded
    category: accuracy
    description: >
      Verify the RED FLAGS section renders and that every flag raised traces to a
      concrete statement in the announcement (escalation flags: cost share, F&A
      limit/waiver, commitment letter, limited submission, signature / institution
      submits; CRU triggers: indemnification, IP / data ownership, publication
      restrictions, insurance, NDA, FAR / contract terms, governing law of another
      state, acceptance of T&C on submission, restricted country / foreign
      ownership, foreign-government / national-lab contracting, CUI / classified).
      FAIL if a flag is asserted with no supporting basis in the document, or if
      the section is omitted entirely. When any CRU trigger is "yes", the "route to
      the Contract Review Unit via VERAS" action line must be present.
  - id: CHK-06
    name: Compliance & International sections grounded
    category: accuracy
    description: >
      Verify the COMPLIANCE RISKS and FOREIGN INFLUENCE & INTERNATIONAL COMPONENTS
      sections render, that only "yes"/"no" areas appear (never "unclear"), and
      that each rendered area traces to a concrete statement in the announcement.
      FAIL if a compliance obligation or international restriction is asserted
      without a supporting basis in the document.
  - id: CHK-07
    name: Mandated internal structure enumerated
    category: completeness
    description: >
      When the announcement enumerates named sections that must appear inside a
      proposal component (most often the Project Description — e.g. "All
      proposals should clearly include sections for each of the following
      aspects:"), verify the deliverable renders a "Required structure" block
      under APPLICATION COMPONENTS listing EVERY mandated section by its
      announcement name, including enumerated sub-parts (numbered sub-sections,
      required table columns, named milestones). FAIL if the enumeration is
      replaced by a pointer to the announcement (e.g. "must include all
      subsections listed in Section V.A") or if named sections are missing.
      PASS trivially (no block expected) when the announcement mandates no
      internal structure — the block must then be absent, not rendered empty.

steps:
  - name: Parallel Extraction (Prompt)
    tasks:
      - name: extract-opportunity-metadata
        input_sources:
          - workflow_documents
        prompt_inline: |
          You are extracting the scalar OPPORTUNITY METADATA from a
          federal funding announcement (RFA / FOA / NOFO / program
          solicitation). You receive the full uploaded document as your
          context. Read the entire document — cover page, header,
          program description, sponsor information, instructions.

          Extract these fields. Quote the document for every value;
          never invent. Use null when the document does not state a
          value.

          - rfa_id: Combined sponsor-prefixed RFA identifier when both
            a sponsor code and opportunity number exist (e.g.,
            "NSF-26-508", "NIH-PA-24-246", "DOE-DE-FOA-0003117"). null
            otherwise.
          - rfa_number: The sponsor's announcement number without
            agency prefix (e.g., "26-508", "PA-24-246",
            "DE-FOA-0003117").
          - rfa_title: Full title of the funding opportunity, including
            any track or component designation. Required.
          - sponsor_name: Full name of the lead sponsoring agency
            (e.g., "National Science Foundation"); never an
            abbreviation. Required.
          - program_code: Sponsor's internal program or division code
            (e.g., "NSF/TIP/ITE"); null if not stated.
          - announcement_url: Canonical URL of the announcement on the
            sponsor's site; null if not present.
          - opportunity_number: Grants.gov or portal opportunity ID
            when distinct from rfa_number; null otherwise.
          - cfda_number: CFDA / Assistance Listing number(s); when
            multiple, comma-separate (e.g., "47.070, 47.076").
          - funding_instrument_type: The award mechanism as stated —
            "Grant", "Cooperative Agreement", "Contract", or another
            instrument the announcement names. Use the document's own
            term; null when it does not state one. Do NOT guess from the
            sponsor (e.g., do not assume "Grant" just because it is NSF).

          ## Output compactness (CRITICAL)

          Your output feeds a downstream consolidation step and is never
          read by a human. The runtime enforces a hard output-token cap on
          this task — a verbose fragment gets cut off mid-string, which
          destroys every field after the cut. Therefore:

          - Emit MINIFIED JSON: one single line, no indentation, no
            newlines inside the JSON, no spaces after `:` or `,`.
          - Minify the SYNTAX only — do NOT shorten, summarize, or drop
            content values. Every fact the schema asks for is still
            required, stated fully ("Up to $5M/year for 4 years, total not
            to exceed $20M" must NOT become "$20M total").
          - Inside a JSON string value, escape any double quote as \"
            or rephrase using single quotes ('added value', not
            "added value") — one unescaped quote invalidates the
            entire fragment.
          - Any JSON examples shown in this prompt are indented for
            readability only — YOUR output must be minified.

          ## Output

          Emit exactly one JSON object with these nine keys. No
          preamble, no closing commentary, no markdown fences. Example
          shape:

          {
            "rfa_id": "NSF-26-508",
            "rfa_number": "26-508",
            "rfa_title": "Mid-Scale Research Infrastructure-2 (Mid-scale RI-2)",
            "sponsor_name": "National Science Foundation",
            "program_code": "NSF/TIP",
            "announcement_url": "https://www.nsf.gov/funding/...",
            "opportunity_number": null,
            "cfda_number": "47.083",
            "funding_instrument_type": "Cooperative Agreement"
          }

          Begin your reply with the character `{` and emit NOTHING except
          the single minified JSON object — no preamble, no questions, no
          offers to help, no commentary, no markdown fences.

      - name: extract-risk-flags
        input_sources:
          - workflow_documents
        prompt_inline: |
          You are extracting the RED FLAGS block of a federal funding
          announcement. You receive the full uploaded document as your
          context. Read the ENTIRE document — eligibility, budget /
          cost principles, submission instructions, required
          attachments, terms and conditions, and any appendix — because
          these triggers are frequently buried late or stated only
          once.

          A pre-award research administrator uses this block to decide,
          within seconds of opening the report, whether this submission
          needs a LONGER lead time, extra institutional routing, or
          Contract Review Unit (CRU) review. Your job is to CHECK FOR
          each known trigger below and report its status.

          Assess EACH of the fixed checks. Ground every determination in
          the document — quote or paraphrase the triggering language in
          `detail`. NEVER assert a trigger the document does not support;
          when the document does not address a check, use status
          "unclear" (not "no"). Use "no" only when the document
          affirmatively indicates the trigger does not apply (e.g., "No
          cost sharing is required", "Indirect costs are permitted at the
          negotiated rate"). Accuracy matters more than completeness —
          the RA would rather see "unclear" than a fabricated flag.

          The checks fall in two groups. Tag each with `category`.

          ### Group 1 — Escalation flags (category: "escalation")
          Items that lengthen the process or require early institutional
          action:

          - "Cost share / matching required" — any required or mandatory
            cost share, matching, or in-kind contribution.
          - "F&A / indirect limited or waived" — indirect (F&A) rate
            capped, reduced, disallowed, or a waiver required (e.g.,
            "indirect costs limited to 10%", "no F&A permitted").
          - "Institutional / executive commitment letter" — a required
            letter of commitment or support that must be signed above the
            PI: institutional, presidential, provost / vice-provost,
            dean, or chair letter.
          - "Limited submission" — the sponsor caps how many proposals
            the INSTITUTION may submit or how many an INDIVIDUAL may be
            named on. Capture the number in `detail`.
          - "Documents requiring signature / institution must submit" —
            an Authorized Organizational Representative (AOR) or
            institutional-official signature is required, and/or the
            proposal must be submitted by the institution rather than the
            PI directly.

          ### Group 2 — Contract Review Unit (CRU) triggers (category: "cru")
          Terms and conditions that require CRU review BEFORE submission.
          Any one of these that is "yes" means the proposal and/or its
          terms must be routed to the Contract Review Officer (via VERAS
          Correspondence) before submission:

          - "Indemnification" — indemnify-and-hold-harmless or similar
            liability-assumption language.
          - "Intellectual property / data ownership restrictions" —
            sponsor claims on IP, invention rights, or data ownership.
          - "Publication restrictions" — limits on the right to publish
            or approval/embargo of publications.
          - "Insurance requirements" — the sponsor requires the
            institution to carry specific insurance.
          - "Nondisclosure agreement (NDA)" — an NDA or confidentiality
            agreement is required.
          - "FAR-based or contract-type terms" — the award is a contract
            or references / is subject to the Federal Acquisition
            Regulation (FAR); procurement/bid-type assistance.
          - "Governing law of another state" — the agreement is governed
            by the law of a state other than Idaho (e.g., Louisiana).
          - "Acceptance of terms & conditions upon submission" — any
            language stating that submitting the proposal constitutes
            acceptance of the sponsor's terms and conditions.
          - "Restricted country / foreign ownership" — involvement of
            entities, collaborators, or subrecipients in China, Russia,
            North Korea, or Iran, including foreign-owned corporations
            based in those countries (e.g., Syngenta).
          - "Foreign government or national-lab contracting" — an
            all-Canadian-Government proposal, or contracting with Idaho
            National Laboratory (INL) or the Jet Propulsion Laboratory
            (JPL) (scope review / draft contracts).
          - "Controlled unclassified information (CUI) or classified
            information" — the project involves CUI or classified
            information exchange.
          - "Other unusual terms and conditions" — any other atypical
            term that a contract reviewer would need to see. Only when
            document-supported; otherwise "unclear".

          For EACH check emit an object with these four keys:

          - check: the exact label from the lists above. Required.
          - category: "escalation" or "cru", per the group. Required.
          - status: one of "yes", "no", "unclear". Required.
          - detail: when status is "yes", a short grounded phrase naming
            the trigger and its specifics (amount, percentage, count, who
            signs, which country/entity, the clause). When "no", a brief
            note of the affirming statement. When "unclear", null.
            Preserve the sponsor's monetary / percentage formatting
            verbatim.

          You may ALSO append additional objects for any OTHER
          document-supported condition that would clearly lengthen the
          process or require early institutional action (e.g., "Required
          travel to a sponsor meeting"). Give those a descriptive `check`
          label, the best-fit `category`, and status "yes". Do not
          manufacture these — only add what the document supports.

          ## Output compactness (CRITICAL)

          Your output feeds a downstream consolidation step and is never
          read by a human. The runtime enforces a hard output-token cap on
          this task — a verbose fragment gets cut off mid-string, which
          destroys every field after the cut. Therefore:

          - Emit MINIFIED JSON: one single line, no indentation, no
            newlines inside the JSON, no spaces after `:` or `,`.
